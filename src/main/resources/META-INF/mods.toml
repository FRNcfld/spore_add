modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"

authors="${mod_authors}"

# 说明文本直接写在这里（不要放进 gradle.properties：那里被 Gradle 以 ISO-8859-1 读取，中文会乱码）。
description='''真菌玩法扩展模组：围绕真菌感染：孢子（Fungal Infection: Spore）的真菌机制做修改与新增，并接入 JEI 配方查看。'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Spore（真菌感染：孢子）：本 mod 的玩法围绕它的真菌机制展开，属于硬依赖。
# modId 取自它自己的 mods.toml（不是文件名）。
[[dependencies.${mod_id}]]
    modId="spore"
    mandatory=true
    versionRange="${spore_version_range}"
    ordering="AFTER"
    side="BOTH"

# JEI：只是可选兼容（装了就能查本 mod 的配方，没装不影响主功能），
# 因此 mandatory=false；side=CLIENT 因为 JEI 本身只在客户端有意义。
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="*"
    ordering="NONE"
    side="CLIENT"
